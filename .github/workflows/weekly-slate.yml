name: Weekly slate

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season year
        default: "2026"
      week:
        description: Week number. Leave blank to choose from the schedule.
        required: false
        default: ""
  schedule:
    # 11:00 UTC is 6:00 AM Eastern Standard Time and 7:00 AM Eastern Daylight Time.
    - cron: "0 11 * * 2" # Tuesday, the new week
    - cron: "0 11 * * 4" # Thursday refresh
    - cron: "0 15 * * 5" # Friday game-day price snapshot, 10:00 AM Eastern Standard Time
    - cron: "0 11 * * 0" # Sunday refresh

permissions:
  contents: write
  pull-requests: write

jobs:
  slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r pipeline/requirements.txt
      - name: Test the pipeline and the dashboard
        run: |
          python -m unittest tests.test_logic tests.test_prices
          cd ..
          npm ci --prefix dashboard
          node --test dashboard/tests/*.mjs
        working-directory: pipeline
      - name: Build the week
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python pipeline/run.py --season "${{ inputs.season || '2026' }}" --week "${{ inputs.week }}"
          else
            python pipeline/run.py --auto --season "${{ inputs.season || '2026' }}"
          fi
      - name: Save the price snapshot
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python pipeline/prices.py --season "${{ inputs.season || '2026' }}" --week "${{ inputs.week }}"
          else
            python pipeline/prices.py --auto --season "${{ inputs.season || '2026' }}"
          fi
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard 'dashboard/src/data' 'dashboard/src/props')" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/slate-$(date -u +%Y%m%d)"
          git checkout -B "$branch"
          git add dashboard/src/data dashboard/src/props
          git commit -m "Refresh the weekly NFL slate"
          git push -u origin "$branch" --force-with-lease
          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updated the open pull request for $branch."
            number="$existing"
          else
            number=$(gh pr create --base main --head "$branch" --title "Refresh the weekly NFL slate" --json number --jq .number --body "$(cat <<'EOF'
          ## Summary
          - Regenerates the week files from public nflverse stats and the schedule.
          - Scores finished games, rolling the calibration forward, and applies scales inside 10%.
          - Saves a getoddy snapshot when that source answers. Existing prices stay. A missed fetch leaves the price blank.

          Tests in this workflow already passed. The data pull request is merged from here.
          EOF
          )")
          fi
          gh pr merge "$number" --merge
